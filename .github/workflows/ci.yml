name: ci

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Hel/Hel.slnx

      - name: Build
        run: dotnet build Hel/Hel.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Hel/Hel.slnx --configuration Release --no-build --verbosity normal